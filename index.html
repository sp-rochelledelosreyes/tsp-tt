<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technology & Transformation - Time Zone Dashboard</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        const TimeZoneOverlapVisualizer = () => {
          const [currentTime, setCurrentTime] = useState(new Date());
          const [selectedHour, setSelectedHour] = useState(null);
          const [clickedHour, setClickedHour] = useState(null);
          const [userTimeZone, setUserTimeZone] = useState('');
          const [userLocalTime, setUserLocalTime] = useState('');

          useEffect(() => {
            const timer = setInterval(() => {
              const now = new Date();
              setCurrentTime(now);
              setUserLocalTime(now.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit',
                hour12: false 
              }));
            }, 1000);
            
            const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
            setUserTimeZone(tz);
            
            return () => clearInterval(timer);
          }, []);

          // Time zone configurations (alphabetical by region)
          const timeZones = [
            { 
              name: '🇦🇺 AET (Australian Eastern Time)',
              abbr: 'AET',
              iana: 'Australia/Sydney',
              color: 'bg-amber-500',
              lightColor: 'bg-amber-100',
              borderColor: 'border-amber-500'
            },
            { 
              name: '🇨🇦 MT (Mountain Time)',
              abbr: 'MT',
              iana: 'America/Denver',
              color: 'bg-purple-500',
              lightColor: 'bg-purple-100',
              borderColor: 'border-purple-500'
            },
            { 
              name: '🇪🇺 CET (Central European Time)',
              abbr: 'CET',
              iana: 'Europe/Paris',
              color: 'bg-blue-500',
              lightColor: 'bg-blue-100',
              borderColor: 'border-blue-500'
            },
            { 
              name: '🇺🇸 ET (Eastern Time)',
              abbr: 'ET',
              iana: 'America/New_York',
              color: 'bg-green-500',
              lightColor: 'bg-green-100',
              borderColor: 'border-green-500'
            }
          ];

          // Get timezone abbreviation dynamically (handles DST automatically)
          const getTimeZoneAbbr = (iana) => {
            const formatter = new Intl.DateTimeFormat('en-US', {
              timeZone: iana,
              timeZoneName: 'short'
            });
            const parts = formatter.formatToParts(currentTime);
            const tzPart = parts.find(part => part.type === 'timeZoneName');
            return tzPart ? tzPart.value : '';
          };

          // Get current time for a specific timezone
          const getCurrentTimeForZone = (tz) => {
            const formatter = new Intl.DateTimeFormat('en-US', {
              timeZone: tz.iana,
              hour: '2-digit',
              minute: '2-digit',
              hour12: false
            });
            return formatter.format(currentTime);
          };

          // Get hour for a specific timezone at a given UTC hour
          const getHourForZone = (tz, utcHour) => {
            const testDate = new Date();
            testDate.setUTCHours(utcHour, 0, 0, 0);
            
            const formatter = new Intl.DateTimeFormat('en-US', {
              timeZone: tz.iana,
              hour: 'numeric',
              hour12: false
            });
            
            return parseInt(formatter.format(testDate));
          };

          // Reasonable collaboration hours: 7 AM to 7 PM (19:00)
          const isReasonableHours = (hour) => hour >= 7 && hour < 19;

          const getOverlapCount = (utcHour) => {
            return timeZones.filter(tz => {
              const localHour = getHourForZone(tz, utcHour);
              return isReasonableHours(localHour);
            }).length;
          };

          const hours = Array.from({ length: 24 }, (_, i) => i);

          // Find which timezone the user is in
          const userTZ = timeZones.find(tz => {
            return userTimeZone.includes(tz.iana.split('/')[1]) || 
                   userTimeZone === tz.iana;
          });

          // Get user's current hour for the timeline
          const userCurrentHour = currentTime.getHours();

          const ClockIcon = () => (
            <svg className="w-8 h-8 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" strokeWidth="2"/>
              <path d="M12 6v6l4 2" strokeWidth="2" strokeLinecap="round"/>
            </svg>
          );

          const UsersIcon = () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" strokeWidth="2"/>
              <circle cx="9" cy="7" r="4" strokeWidth="2"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" strokeWidth="2"/>
            </svg>
          );

          const MapPinIcon = () => (
            <svg className="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" strokeWidth="2"/>
              <circle cx="12" cy="10" r="3" strokeWidth="2"/>
            </svg>
          );

          const SmallClockIcon = () => (
            <svg className="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" strokeWidth="2"/>
              <path d="M12 6v6l4 2" strokeWidth="2" strokeLinecap="round"/>
            </svg>
          );

          return (
            <div className="w-full max-w-7xl mx-auto p-6 bg-gradient-to-br from-slate-50 to-slate-100 rounded-xl shadow-lg">
              <div className="mb-8">
                <div className="flex items-center gap-3 mb-3">
                  <ClockIcon />
                  <h1 className="text-3xl font-bold text-slate-800">Technology & Transformation - Time Zone Dashboard</h1>
                </div>
                <p className="text-slate-600 mb-4 max-w-4xl">
                  A live reference tool to instantly view current times across our global team. This dashboard automatically adjusts for daylight saving time changes and updates in real-time, helping you identify the best windows for collaboration across time zones.
                </p>
                
                <div className="flex flex-wrap gap-4 items-center text-sm">
                  <div className="flex items-center gap-2 bg-white px-4 py-2 rounded-lg shadow-sm">
                    <MapPinIcon />
                    <span className="text-slate-600">Your Location:</span>
                    <span className="font-semibold text-slate-800">{userTimeZone}</span>
                  </div>
                  <div className="flex items-center gap-2 bg-white px-4 py-2 rounded-lg shadow-sm">
                    <SmallClockIcon />
                    <span className="text-slate-600">Your Time:</span>
                    <span className="font-semibold text-slate-800">{userLocalTime}</span>
                  </div>
                  {userTZ && (
                    <div className={`flex items-center gap-2 px-4 py-2 rounded-lg shadow-sm ${userTZ.lightColor} ${userTZ.borderColor} border-2`}>
                      <span className="text-slate-700">You're in: <strong>{userTZ.abbr}</strong></span>
                    </div>
                  )}
                </div>
              </div>

              {/* Current Times Display */}
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                {timeZones.map((tz, idx) => {
                  const currentTimeStr = getCurrentTimeForZone(tz);
                  const currentHour = parseInt(currentTimeStr.split(':')[0]);
                  const currentLabel = getTimeZoneAbbr(tz.iana);
                  const isReasonable = isReasonableHours(currentHour);
                  const isUserZone = userTZ && userTZ.abbr === tz.abbr;
                  
                  return (
                    <div key={idx} className={`p-4 rounded-lg border-2 ${tz.borderColor} ${tz.lightColor} ${isUserZone ? 'ring-2 ring-slate-700' : ''} relative`}>
                      {isUserZone && (
                        <div className="absolute top-2 right-2 text-xs font-bold text-slate-700 bg-white px-2 py-1 rounded">
                          YOU
                        </div>
                      )}
                      <div className="text-base font-bold text-slate-800 mb-1">{tz.name}</div>
                      <div className="text-xs text-slate-500 mb-2">
                        Currently: <strong>{currentLabel}</strong>
                      </div>
                      <div className="text-2xl font-bold text-slate-900">
                        {currentTimeStr}
                      </div>
                      <div className={`text-xs mt-1 ${isReasonable ? 'text-green-600 font-semibold' : 'text-slate-400'}`}>
                        {isReasonable ? '● Good for collaboration' : '○ Outside typical hours'}
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Visual Timeline */}
              <div className="bg-white rounded-lg p-6 shadow-md">
                <h2 className="text-xl font-bold text-slate-800 mb-2 flex items-center gap-2">
                  <UsersIcon />
                  24-Hour View of Potential Collaborative Hours
                </h2>
                <p className="text-sm text-slate-600 mb-4">
                  Colored blocks show reasonable collaboration hours (7 AM - 7 PM local time) for each region. The black outlined box indicates your current local time. <strong>Click any time slot to see which team time zones are within reasonable collaboration hours</strong> and see detailed times for all zones.
                </p>
                
                <div className="space-y-3">
                  {timeZones.map((tz, tzIdx) => {
                    const isUserZone = userTZ && userTZ.abbr === tz.abbr;
                    return (
                      <div key={tzIdx} className="flex items-center gap-3">
                        <div className={`w-32 text-sm font-semibold flex-shrink-0 ${isUserZone ? 'text-slate-900' : 'text-slate-700'}`}>
                          {tz.abbr}
                          {isUserZone && <span className="text-xs block text-slate-500">(You)</span>}
                        </div>
                        <div className="flex-1 flex gap-0.5">
                          {hours.map((utcHour) => {
                            const localHour = getHourForZone(tz, utcHour);
                            const isReasonable = isReasonableHours(localHour);
                            const isCurrent = utcHour === currentTime.getUTCHours();
                            
                            return (
                              <div
                                key={utcHour}
                                className={`flex-1 h-10 relative cursor-pointer ${
                                  isReasonable ? tz.color : 'bg-slate-200'
                                } ${isCurrent ? 'ring-2 ring-slate-900' : ''} ${clickedHour === utcHour ? 'ring-2 ring-teal-600' : ''}`}
                                style={{ transition: 'opacity 0.2s ease' }}
                                onClick={() => setClickedHour(clickedHour === utcHour ? null : utcHour)}
                                onMouseEnter={(e) => {
                                  e.currentTarget.style.opacity = '0.8';
                                  if (clickedHour === null) setSelectedHour(utcHour);
                                }}
                                onMouseLeave={(e) => {
                                  e.currentTarget.style.opacity = '1';
                                  if (clickedHour === null) setSelectedHour(null);
                                }}
                                title={`${tz.abbr} ${localHour}:00 (Click to lock)`}
                              >
                                {isCurrent && (
                                  <div className="absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-1 w-0 h-0 border-l-4 border-r-4 border-b-4 border-transparent border-b-slate-900"></div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                  
                  {/* Your Local Time Labels */}
                  {userTZ && (
                    <div className="flex items-center gap-3 mt-2">
                      <div className="w-32 text-xs font-semibold text-slate-700 flex-shrink-0">Your current local time:</div>
                      <div className="flex-1 flex gap-0.5">
                        {hours.map((utcHour) => {
                          const userHour = getHourForZone(userTZ, utcHour);
                          return (
                            <div key={utcHour} className="flex-1 text-center text-xs text-slate-600">
                              {userHour % 3 === 0 ? userHour : ''}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}

                  {/* Overlap Indicator */}
                  <div className="flex items-center gap-3 mt-4 pt-4 border-t border-slate-200">
                    <div className="w-32 text-xs font-bold text-slate-700 flex-shrink-0">Team Overlap</div>
                    <div className="flex-1 flex gap-0.5">
                      {hours.map((utcHour) => {
                        const count = getOverlapCount(utcHour);
                        const opacity = count === 0 ? 0.1 : count / 4;
                        
                        return (
                          <div
                            key={utcHour}
                            className={`flex-1 h-8 flex items-center justify-center text-xs font-bold text-white relative`}
                            style={{ 
                              backgroundColor: `rgba(15, 118, 110, ${opacity})`,
                              border: selectedHour === utcHour ? '2px solid #0f766e' : 'none'
                            }}
                          >
                            {count > 0 && count}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>

                {/* Hover/Click Info - Fixed height to prevent layout shift */}
                <div className="mt-6" style={{ minHeight: '140px' }}>
                  {(selectedHour !== null || clickedHour !== null) && (
                    <div className="p-4 bg-slate-50 rounded-lg border border-slate-200">
                      <div className="font-semibold text-slate-800 mb-2 flex items-center gap-2">
                        {clickedHour !== null && (
                          <span className="text-teal-600 text-xs">🔒 Locked</span>
                        )}
                        <span>{getOverlapCount(clickedHour ?? selectedHour)} team time zone(s) are in reasonable collaboration hours</span>
                      </div>
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-2 text-sm">
                        {timeZones.map((tz, idx) => {
                          const localHour = getHourForZone(tz, clickedHour ?? selectedHour);
                          const isReasonable = isReasonableHours(localHour);
                          const isUserZone = userTZ && userTZ.abbr === tz.abbr;
                          return (
                            <div key={idx} className={`p-2 rounded ${isReasonable ? tz.lightColor : 'bg-slate-100'} ${isUserZone ? 'ring-2 ring-slate-700' : ''}`}>
                              <div className="font-semibold">
                                {tz.abbr}
                                {isUserZone && <span className="text-xs ml-1">(You)</span>}
                              </div>
                              <div>{localHour.toString().padStart(2, '0')}:00</div>
                              <div className={`text-xs ${isReasonable ? 'text-green-600' : 'text-slate-400'}`}>
                                {isReasonable ? '✓ Good time' : '✗ Too early/late'}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                      {clickedHour !== null && (
                        <div className="text-xs text-slate-500 mt-2 text-center">
                          Click the highlighted time slot again to unlock
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>

              {/* Legend */}
              <div className="mt-6 grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                {timeZones.map((tz, idx) => (
                  <div key={idx} className="flex items-center gap-2">
                    <div className={`w-4 h-4 rounded ${tz.color}`}></div>
                    <span className="text-slate-700">{tz.name}</span>
                  </div>
                ))}
              </div>

              {/* DST Info */}
              <div className="mt-4 text-xs text-slate-500 text-center">
                DST automatically detected and handled • Updates in real-time every second
              </div>
            </div>
          );
        };

        ReactDOM.render(<TimeZoneOverlapVisualizer />, document.getElementById('root'));
    </script>
</body>
</html>
